<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/proyectoIntegrador/CSS/style.css">
    <title>CineMax CESDE</title>
</head>
<body>
    <header>
        <h1>CineMax CESDE</h1>
    </header>
    <main>
        <section class="main_content">
            <div class="ticket_purchase">
                    <form action="">
                        <div class="form_purchase">
                            <label for="" class="">Nombre del Cliente
                                <input type="text" name="" id="" placeholder="Digite su nombre" class="purchase_input" aria-label="Nombre del Cliente">
                            </label>
                            <label for="">Título de la Película
                                <input type="text" name="" id="" placeholder="Digite el titulo de la pelicula" class="purchase_input" aria-label="Titulo de la Pelicula">
                            </label>
                            <label for="">Edad
                                <input type="number" name="" id="" min="2" max="99" class="purchase_input" aria-label="Edad">
                            </label>
                            <label for="">Cantidad de Tickets
                                <input type="number" name="" id="" min="1" max="9" class="purchase_input" aria-label="Cantidad de Tickets">
                            </label>
                        </div>
                        <div class="form_actions">
                            <button type="submit">Procesar Compra</button>
                        </div>
                    </form>
            </div>
            <div class="movies_list">
                 <!--Creación de la tabla contenedora de la cartelera de cine-->
                <table border="1">
                    <thead>
                        <!--Definición de los titulos en las columnas de la tabla-->
                        <tr>
                            <th>Título</th>
                            <th>Horario</th>
                            <th>Genero</th>
                            <th>Poster</th>
                            <th>Trailer</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>El señor de los anillos</td>
                            <td>20:30</td>
                            <td>Aventura</td>
                            <td>
                                <img src="/proyectoIntegrador/img/TLOTR.jpg" alt="PosterTLOTR">
                            </td>
                            <td>
                                <iframe src="https://www.youtube.com/embed/LbfMDwc4azU?si=qCzIuHfO63Cb4S1R" frameborder="0" title="TrailerTLOTF"></iframe>
                            </td>
                        </tr>
                        <tr>
                            <td>Harry Potter</td>
                            <td>16:45</td>
                            <td>Fantasía</td>
                            <td>
                                <img src="/proyectoIntegrador/img/HPOOF.jpg" alt="PosterHP">
                            </td>
                            <td>
                                <iframe src="https://www.youtube.com/embed/jdEulcjAvQI?si=0uWUv2d4bIsIaGHV" title="TrailerHP" frameborder="0"></iframe>
                            </td>
                        </tr>
                        <tr>
                            <td>Avatar</td>
                            <td>21:10</td>
                            <td>Ciencia Ficción</td>
                            <td>
                                <img src="/proyectoIntegrador/img/Avatar.jpg" alt="PosterAvatar">
                            </td>
                            <td>
                                <iframe src="https://www.youtube.com/embed/aVdO-cx-McA?si=-df82sQ8AcmzRlBI" frameborder="0" title="AvatarTrailer"></iframe>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>        
        </section>
    </main>
    <footer>
        <section class="footer_information">
            <div class="footer_version">
                <p>2026 CineMax CESDE Todos los derechos reservados</p>
            </div>
            <div class="footer_contact">
                <a href="#" class="social_link" aria-label="Facebook">
                    <img src="" alt="Facebook">
                </a>
                <a href="#" class="social_link" aria-label="Twitter">
                    <img src="" alt="Twitter">
                </a>
                <a href="#" class="social_link" aria-label="Instagram">
                    <img src="" alt="Facebook">
                </a>
            </div>
            <div class="footer_legal">
                <ul>
                    <li>
                        <a href="#">Información Legal</a>
                    </li>
                    <li>
                        <a href="#">Acerca de CineMax CESDE</a>
                    </li>
                    <li>
                        <a href="#">Contactenos PQRS</a>
                    </li>
                    <li>
                        <a href="#">Preguntas Frecuentes</a>
                    </li>
                </ul>
            </div>
        </section>
    </footer>
</body>
</html>
